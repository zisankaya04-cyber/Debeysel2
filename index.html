
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayı Hafızası Testi</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container { width: 100%; padding: 20px; }

#number {
    font-size: clamp(80px, 20vw, 180px);
    font-weight: bold;
}

#countdown {
    font-size: 100px;
    font-weight: bold;
}

#status {
    font-size: 22px;
    margin-bottom: 30px;
}

button {
    display: none;
    padding: 18px 35px;
    margin-top: 35px;
    border: none;
    border-radius: 12px;
    background: #2878ff;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

#startButton { display: inline-block; }

#progress {
    margin-top: 20px;
    font-size: 18px;
    color: #aaa;
}
</style>
</head>

<body>

<div class="container">
    <div id="status">Sayı Hafızası Testi</div>
    <div id="number"></div>
    <div id="countdown"></div>
    <div id="progress"></div>

    <button id="startButton" onclick="startTest()">Teste Başla</button>
    <button id="nextButton" onclick="nextSet()">Sonraki Sete Geç</button>
</div>

<script>
const sets = [
 ["4","9","1","6","3","7"],
 ["9","4","8","2","7","5","3"],
 ["5","1","8","4","9","2","7","3"],
 ["94","58","74"],
 ["36","97","51","48"],
 ["519","738"]
];

// Her setin sonunda gösterilecek sayılar
const finalNumbers = ["42", "33", "95", "83", "19", "57"];

let currentSet = 0;
let currentNumber = 0;

const numberElement = document.getElementById("number");
const countdownElement = document.getElementById("countdown");
const statusElement = document.getElementById("status");
const progressElement = document.getElementById("progress");
const startButton = document.getElementById("startButton");
const nextButton = document.getElementById("nextButton");

function startTest() {
    startButton.style.display = "none";
    currentSet = 0;
    showSet();
}

function showSet() {
    currentNumber = 0;
    numberElement.textContent = "";
    countdownElement.textContent = "";
    nextButton.style.display = "none";

    statusElement.textContent = (currentSet + 1) + ". SET";
    progressElement.textContent = "";

    showNumber();
}

function showNumber() {
    if (currentNumber >= sets[currentSet].length) {
        showFinalNumber();
        return;
    }

    numberElement.textContent = sets[currentSet][currentNumber];

    setTimeout(() => {
        numberElement.textContent = "";
        currentNumber++;

        setTimeout(showNumber, 100);

    }, 1500);
}

// Set sonunda özel sayıyı 9 saniye göster
function showFinalNumber() {
    numberElement.textContent = finalNumbers[currentSet];

    statusElement.textContent = "";
    countdownElement.textContent = "";
    progressElement.textContent = "";
    nextButton.style.display = "none";

    setTimeout(() => {
        numberElement.textContent = "";

        statusElement.textContent = (currentSet + 1) + ". SET TAMAMLANDI";
        progressElement.textContent = "Sonraki aşamaya geçebilirsiniz.";

        nextButton.style.display = "inline-block";

        if (currentSet === sets.length - 1) {
            nextButton.textContent = "Testi Tamamla";
        }

    }, 9000);
}

function nextSet() {
    if (currentSet < sets.length - 1) {
        currentSet++;
        nextSetButtonReset();
        showSet();

    } else {
        numberElement.textContent = "";
        countdownElement.textContent = "";
        statusElement.textContent = "TEST TAMAMLANDI";
        progressElement.textContent = "6 set tamamlandı.";
        nextButton.style.display = "none";
    }
}

function nextSetButtonReset() {
    nextButton.textContent = "Sonraki Sete Geç";
}
</script>

</body>
</html>
